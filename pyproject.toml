[project]
name = "assignment-01"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Your existing dependencies
    "camelot-py>=1.0.0",
    "opencv-python", # Required for camelot table detection
    "ghostscript",
    "layoutparser",
    "numpy",
    "pandas",
    "pdfplumber",
    "pillow", # Compatibility fix for LayoutParser/Detectron2
    "playwright",
    "pytesseract",
    "requests",
    "sec-edgar-downloader",
    # Essential Docling dependencies
    "docling==1.20.0",
    "pypdfium2",
    "python-magic",
    "pydantic>=2.0.0",
    "beautifulsoup4",
    "lxml",
    # AI/ML dependencies for Docling
    "transformers",
    "torch",
    "torchvision",
    "accelerate",
    "sentencepiece",
    "dvc>=3.63.0",
    # "detectron2@git+
    "detectron2@git+https://github.com/facebookresearch/detectron2.git@v0.5#egg=detectron2 --no-build-isolation", # Required for LayoutParser
]

[tool.uv.extra-build-dependencies]
detectron2 = ["torch", "torchvision"]
